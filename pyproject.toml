[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dj-engine"
version = "0.1.0"
description = "Lokale DJ track-database & live recommendation engine (Camelot/BPM/energy/mood-gebaseerd)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Paul Meinhardt", email = "paulmeinhardt@pm.me" }]

dependencies = [
    "mutagen>=1.46",
    "musicbrainzngs>=0.7.1",
    "click>=8.1",
    "PyYAML>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
analysis = ["essentia>=2.1b6.dev1"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
dj-engine = "dj_engine.cli:main"

[tool.setuptools.packages.find]
include = ["dj_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
