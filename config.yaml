# dj-engine configuratie
# Alle instelbare parameters staan hier — niets hardcoded in de code.

database:
  path: "data/dj_engine.db"

audio:
  # Ondersteunde bestandsextensies voor ingest
  extensions: [".mp3", ".wav", ".flac", ".aiff", ".aif", ".m4a"]
  # Sample rate waarop Essentia audio inlaadt
  sample_rate: 44100

musicbrainz:
  # Verplicht door MusicBrainz API-gebruiksvoorwaarden: max. 1 request/seconde.
  rate_limit_per_second: 1.0
  # Unieke, identificeerbare User-Agent zoals MusicBrainz vereist: naam/versie (contact)
  user_agent_name: "dj-engine"
  user_agent_version: "0.1.0"
  user_agent_contact: "paulmeinhardt@pm.me"
  # Aantal retries bij netwerkfouten/timeouts voordat een lookup wordt overgeslagen
  max_retries: 3
  timeout_seconds: 10

models:
  # Map met optionele pretrained Essentia TensorFlow-modellen (Discogs-EffNet + downstream classifiers).
  # Als deze bestanden ontbreken, wordt mood/genre-classificatie overgeslagen (kolommen blijven NULL).
  directory: "models"
  embedding_model: "discogs-effnet-bs64-1.pb"
  mood_models:
    mood_happy: "mood_happy-discogs-effnet-1.pb"
    mood_sad: "mood_sad-discogs-effnet-1.pb"
    mood_aggressive: "mood_aggressive-discogs-effnet-1.pb"
    mood_relaxed: "mood_relaxed-discogs-effnet-1.pb"
    mood_party: "mood_party-discogs-effnet-1.pb"
  genre_model: "genre_discogs400-discogs-effnet-1.pb"
  genre_labels: "genre_discogs400-discogs-effnet-1.json"

rekordbox:
  # Prefix-herschrijfregels voor Rekordbox' opgeslagen paden (vaak Windows,
  # bv. "C:/Users/naam/Music") naar een pad dat op dit systeem bestaat.
  # Leeg = paden ongewijzigd laten. `import-rekordbox` werkt dan alleen op
  # metadata-niveau (bpm/key/genre) totdat dit ingevuld is — `analyze`/
  # `refine` geven een duidelijke 'bestand niet gevonden'-fout.
  #
  # Dit pad is persoonlijk/machine-specifiek — hoort niet in git. Zet 'm in
  # config.local.yaml (zelfde map, automatisch meegeladen als hij bestaat,
  # staat in .gitignore) i.p.v. hier. Zie config.local.yaml.example.
  path_mapping: []

suggest:
  # Aantal kandidaten dat suggest_next() intern doorgeeft aan de
  # achtergrond-verfijningsstap (recommend/refine.py) bij `dj-engine suggest`.
  shortlist_size: 40

analysis_pool:
  # Aantal parallelle workerprocessen voor recommend/refine.py. Elke
  # TF-inference gebruikt intern ~2 cores (gemeten) — hou hier rekening mee
  # t.o.v. het aantal beschikbare cores van deze machine.
  workers: 4

claude_api:
  # Infrastructuur voor een optionele, nog NIET gebouwde AI-suggestiebron
  # (--source llm, via websearch). Nu alleen configuratie, geen functionaliteit.
  enabled: false
  model: "claude-sonnet-5"
  # Naam van de environment-variabele met de API-key (nooit de key zelf
  # hier in config.yaml — dat bestand staat in git). Zet 'm handmatig via
  # `dj-engine set-api-key <key>` (schrijft naar .env, dat wél genegeerd
  # wordt door git) of je eigen shell-environment.
  api_key_env_var: "ANTHROPIC_API_KEY"

scoring:
  # Maximale BPM-afwijking (percentage) die nog een score > 0 oplevert.
  bpm_max_deviation_pct: 8.0
  # Aantal recent gebruikte tracks dat standaard wordt uitgesloten van suggesties.
  default_exclude_recent: 5
  # Drempel voor db.maybe_normalize_energy(): pas de energy-kolom pas
  # herschalen na dit aantal 'pending' tracks (energy_raw net gezet, energy
  # nog niet bijgewerkt), i.p.v. bij elke losse on-demand analyse.
  energy_renormalize_threshold: 20
  # Camelot-compatibiliteitsscores (0-100), zie analysis/camelot.py
  camelot_scores:
    same: 100
    adjacent_same_letter: 90
    relative_major_minor: 85
    two_step_same_letter: 75
    other: 30

  # Doel-energieverschuiving per richting: energy_score() beloont een
  # verschil in `energy` (candidate - huidige track, op de 0-1 schaal) dat
  # binnen [center - plateau, center + plateau] valt met het maximum (100),
  # en loopt daarna lineair af naar 0 over `falloff` afstand.
  # 'surprise' laat energie bewust grotendeels los (plateau dekt vrijwel het
  # hele bereik) — bij die richting draagt vooral mood/genre de verrassing.
  energy_targets:
    build:
      center: 0.25
      plateau: 0.10
      falloff: 0.50
    hold:
      center: 0.0
      plateau: 0.05
      falloff: 0.35
    ease:
      center: -0.25
      plateau: 0.10
      falloff: 0.50
    surprise:
      center: 0.0
      plateau: 1.0
      falloff: 0.50

  # Gewichtenprofielen per richting. Moeten optellen tot 1.0 per richting
  # (de engine normaliseert desnoods, maar houd ze in balans).
  weights:
    build:
      key: 0.35
      bpm: 0.25
      energy: 0.30
      mood: 0.10
    hold:
      key: 0.40
      bpm: 0.35
      energy: 0.15
      mood: 0.10
    ease:
      key: 0.35
      bpm: 0.20
      energy: 0.35
      mood: 0.10
    surprise:
      key: 0.15
      bpm: 0.15
      energy: 0.20
      mood: 0.50

logging:
  level: "INFO"
  file: "logs/dj_engine.log"
